name: Build
on:
  pull_request:
  workflow_call:
    inputs:
      deploy:
        description: True for the deploy, which stops on a product without a green run and waits for a run in progress.
        type: boolean
        default: false
      product:
        description: The caller's folder in sources.toml. Empty reads each product at its newest green commit.
        type: string
        default: ""
      ref:
        description: The caller's commit, which its product is built at.
        type: string
        default: ""
    secrets:
      DOCS_APP_PRIVATE_KEY:
        description: The private key of the GitHub App that reads the four repositories.
        required: false
permissions:
  contents: read
jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # A step's condition cannot read a secret, so the job states once whether both halves of the credential are set. A
      # pull request from a fork gets no secret and reads with the job's own token, which reads no other private
      # repository.
      DOCS_CREDENTIAL: ${{ vars.DOCS_APP_CLIENT_ID != '' && secrets.DOCS_APP_PRIVATE_KEY != '' }}
    steps:
      # The selection would refuse a product that sources.toml does not name, but behind the token step and with a usage
      # line about --own, an argument no caller writes. This guard stops such a caller in front of the token step, with
      # a line that names the input.
      - if: inputs.product != '' && !contains(fromJSON('["companion", "proxy", "router"]'), inputs.product)
        run: |
          echo "the product input names no folder of sources.toml"
          exit 1
      # The selection would refuse a product without a commit in the same place and words, so this guard stops that
      # caller in front of the token step, with a line that names the empty input.
      - if: inputs.product != '' && inputs.ref == ''
        run: |
          echo "the ref input is empty, and a product's build needs the caller's commit"
          exit 1
      # A commit without a product leaves OWN empty, so the selection would read each product at its newest green commit
      # and the build would pass without the caller's change.
      - if: inputs.product == '' && inputs.ref != ''
        run: |
          echo "the product input is empty, and the ref input names a product's commit"
          exit 1
      - id: app
        if: env.DOCS_CREDENTIAL == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.DOCS_APP_CLIENT_ID }}
          owner: phoebis-project
          permission-actions: read
          permission-contents: read
          private-key: ${{ secrets.DOCS_APP_PRIVATE_KEY }}
          repositories: phoebis,phoebis-companion,phoebis-docs,phoebis-proxy
      # Where the App lacks a permission asked for above, the token step fails with the action's own error. This line
      # names the App's variable and the two permissions, so the reader of the red run knows what to grant.
      - if: failure() && steps.app.conclusion == 'failure'
        run: |
          echo "::error::No token for the build. The GitHub App behind DOCS_APP_CLIENT_ID needs read access to" \
            "Actions and to contents of phoebis, phoebis-companion, phoebis-docs and phoebis-proxy."
      # A called workflow runs in the caller's repository, so this checkout names its own. A pull request of this
      # repository builds its own commit. Each other run builds main here: a product's call, and a deploy, whose
      # second run would otherwise publish the pages of its first commit over newer ones.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.repository == 'phoebis-project/phoebis-docs' && github.event_name == 'pull_request' && github.sha || 'main' }}
          repository: phoebis-project/phoebis-docs
          token: ${{ steps.app.outputs.token || github.token }}
      # OWN hands the caller's commit through, since a product's run checks its own change. The inputs reach the script
      # through the environment, so no caller's value becomes text of the shell line. The script prints its lines last
      # and all at once, so a stop leaves no output and a red step.
      - id: commits
        env:
          DEPLOY: ${{ inputs.deploy }}
          GH_TOKEN: ${{ steps.app.outputs.token || github.token }}
          OWN: ${{ inputs.product != '' && format('{0}={1}', inputs.product, inputs.ref) || '' }}
        run: |
          arguments=()
          if [ -n "$OWN" ]; then arguments+=(--own "$OWN"); fi
          if [ "$DEPLOY" = true ]; then arguments+=(--wait 300 --every 10); else arguments+=(--or-main); fi
          python3 scripts/green-commits.py "${arguments[@]}" >> "$GITHUB_OUTPUT"
      # actions/checkout reads an empty ref as the default branch, so a selection that ended with exit 0 and named no
      # commit for a product would build that product at main and pass.
      - if: >-
          steps.commits.outputs.companion == '' || steps.commits.outputs.proxy == '' ||
          steps.commits.outputs.router == ''
        run: |
          echo "the selection named no commit for a product, and an empty ref would read main"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: checkouts/router
          persist-credentials: false
          ref: ${{ steps.commits.outputs.router }}
          repository: phoebis-project/phoebis
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: checkouts/companion
          persist-credentials: false
          ref: ${{ steps.commits.outputs.companion }}
          repository: phoebis-project/phoebis-companion
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: checkouts/proxy
          persist-credentials: false
          ref: ${{ steps.commits.outputs.proxy }}
          repository: phoebis-project/phoebis-proxy
          token: ${{ steps.app.outputs.token || github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.x"
      - run: scripts/tests/assemble.sh
      - run: scripts/tests/check-site.sh
      - run: scripts/tests/green-commits.sh
      - run: scripts/tests/preview.sh
      - run: python3 scripts/assemble.py --checkout router=checkouts/router --checkout companion=checkouts/companion --checkout proxy=checkouts/proxy
      # Pinned to the version the site is written and checked against. A newer Zensical may warn on syntax this one
      # accepts, and a warning fails the build below.
      - run: pip install zensical==0.0.62
      - run: zensical build --clean --strict
        working-directory: build
      - run: python3 scripts/check-site.py links
      - run: python3 scripts/check-site.py prose build/docs README.md checkouts/router/README.md checkouts/companion/README.md checkouts/proxy/README.md
      # A run's artifact is open to each reader of the run's repository, and the site holds the pages of each product.
      # So the upload runs under the condition of deploy.yml's deploy job, the one job that reads the artifact. The
      # repository is named since a called workflow reads the caller's variables.
      - if: vars.DOCS_PUBLISH == '1' && github.ref == 'refs/heads/main' && github.repository == 'phoebis-project/phoebis-docs'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/site
